<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leidy 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

.text{
position:absolute;
top:30px;
width:100%;
text-align:center;
font-size:70px;
font-weight:bold;
color:#7ec8ff;
z-index:10;
text-shadow:
0 0 10px #7ec8ff,
0 0 20px #7ec8ff,
0 0 40px #7ec8ff,
0 0 80px #7ec8ff;
}

.sub{
position:absolute;
bottom:60px;
width:100%;
text-align:center;
font-size:24px;
color:white;
z-index:10;
}

.button{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
padding:15px 35px;
border:none;
border-radius:50px;
background:#2196f3;
color:white;
font-size:20px;
cursor:pointer;
z-index:20;
box-shadow:
0 0 20px #2196f3,
0 0 50px #2196f3;
}

.button:hover{
transform:translateX(-50%) scale(1.1);
}
</style>

</head>

<body>

<div class="text">I Love You 💙</div>

<div class="sub">
Eres mi persona favorita
</div>

<button class="button" onclick="playMusic()">
💖 Presióname
</button>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-11786.mp3">
</audio>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/FontLoader.js";
import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/geometries/TextGeometry.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 100;

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);

document.body.appendChild(
renderer.domElement
);

const light = new THREE.PointLight(
0x7ec8ff,
10,
500
);

light.position.set(0,0,80);

scene.add(light);

const ambient = new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambient);

/* ESTRELLAS */

const starsGeometry = new THREE.BufferGeometry();

const starsCount = 6000;

const starsPositions =
new Float32Array(starsCount*3);

for(let i=0;i<starsCount;i++){

starsPositions[i*3]=(Math.random()-0.5)*500;
starsPositions[i*3+1]=(Math.random()-0.5)*500;
starsPositions[i*3+2]=(Math.random()-0.5)*500;

}

starsGeometry.setAttribute(
"position",
new THREE.BufferAttribute(
starsPositions,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:"#ffffff",
size:0.35
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* CORAZON */

const geometry =
new THREE.BufferGeometry();

const count = 30000;

const positions =
new Float32Array(count*3);

for(let i=0;i<count;i++){

let t = Math.random()*Math.PI*2;
let r = Math.random();

let x =
16*Math.pow(Math.sin(t),3);

let y =
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);

x *= (1-r*0.35);
y *= (1-r*0.35);

positions[i*3] = x*3;
positions[i*3+1] = y*3;
positions[i*3+2] =
(Math.random()-0.5)*20;

}

geometry.setAttribute(
"position",
new THREE.BufferAttribute(
positions,
3
)
);

const material =
new THREE.PointsMaterial({

color:"#7ec8ff",
size:0.45,
transparent:true,
opacity:1,
blending:THREE.AdditiveBlending

});

const heart =
new THREE.Points(
geometry,
material
);

scene.add(heart);

/* TEXTO LEIDY */

let textMesh;

const loader =
new FontLoader();

loader.load(
"https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",

(font)=>{

const textGeometry =
new TextGeometry(
"LEIDY",
{
font:font,
size:8,
depth:2,
bevelEnabled:true,
bevelThickness:0.3,
bevelSize:0.2
}
);

textGeometry.center();

const textMaterial =
new THREE.MeshStandardMaterial({

color:0xffffff,
emissive:0x7ec8ff,
emissiveIntensity:3

});

textMesh =
new THREE.Mesh(
textGeometry,
textMaterial
);

textMesh.visible=false;

scene.add(textMesh);

}
);

let time = 0;
let explode = false;

setTimeout(()=>{
explode = true;
},6000);

function animate(){

requestAnimationFrame(
animate
);

time += 0.01;

heart.rotation.y += 0.008;
heart.rotation.x += 0.002;

const pulse =
1 +
Math.sin(time*4)*0.05;

heart.scale.set(
pulse,
pulse,
pulse
);

if(explode){

const pos =
heart.geometry.attributes.position.array;

for(let i=0;i<pos.length;i+=3){

pos[i]+=(Math.random()-0.5)*0.2;
pos[i+1]+=(Math.random()-0.5)*0.2;
pos[i+2]+=(Math.random()-0.5)*0.2;

}

heart.geometry.attributes.position.needsUpdate=true;

if(textMesh){

textMesh.visible=true;

textMesh.rotation.y += 0.01;

const glow =
1 +
Math.sin(time*5)*0.05;

textMesh.scale.set(
glow,
glow,
glow
);

}

}

stars.rotation.y += 0.0008;

renderer.render(
scene,
camera
);

}

animate();

window.playMusic = function(){

document
.getElementById("music")
.play();

}

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
